<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>MyCompanion</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header>
    <button id="back" class="icon hidden">‹</button>
    <div>
      <h1>MyCompanion</h1>
      <div id="subtitle">Tus compañeros virtuales</div>
    </div>
    <button id="newChar" class="primary">＋</button>
  </header>

  <main>
    <section id="characters" class="screen"></section>

    <section id="chat" class="screen hidden">
      <div id="messages"></div>
      <div class="composer">
        <button id="imageBtn" title="Generar imagen">🖼️</button>
        <input id="text" autocomplete="off" placeholder="Escribe un mensaje…">
        <button id="send" class="primary">➤</button>
      </div>
      <button id="speak" class="secondary">🔊 Leer última respuesta</button>
    </section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="card">
    <h2>Crear personaje</h2>
    <input id="cname" placeholder="Nombre">
    <textarea id="cpersonality" placeholder="Personalidad: cariñosa, divertida..."></textarea>
    <textarea id="cappearance" placeholder="Apariencia visual del personaje adulto..."></textarea>
    <button id="create" class="primary wide">Crear</button>
    <button id="close" class="secondary wide">Cancelar</button>
  </div>
</div>

<div id="imageModal" class="modal hidden">
  <div class="card">
    <h2>Generar imagen</h2>
    <textarea id="imagePrompt" placeholder="Describe la escena: caminando por la playa al atardecer..."></textarea>
    <button id="generate" class="primary wide">Generar</button>
    <button id="closeImage" class="secondary wide">Cancelar</button>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
